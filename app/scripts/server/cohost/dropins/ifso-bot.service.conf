# Co-host drop-in (provision.sh --cohost): Ifso's own Bun, and hard limits so Ifso can never starve the other project.
[Unit]
After=ifso-redis.service
Wants=ifso-redis.service

[Service]
ExecStart=
ExecStart=/opt/ifso/bin/bun src/main.ts bot
MemoryMax=256M
MemoryHigh=224M
CPUQuota=50%
CPUWeight=50
IOWeight=50
TasksMax=256
Nice=10
OOMScoreAdjust=500

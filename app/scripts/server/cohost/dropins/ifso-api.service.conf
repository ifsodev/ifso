# Co-host drop-in (provision.sh --cohost): Ifso's own Bun, and hard limits so Ifso can never starve the other project.
[Unit]
After=ifso-redis.service
Wants=ifso-redis.service

[Service]
ExecStart=
ExecStart=/opt/ifso/bin/bun src/main.ts api
MemoryMax=512M
MemoryHigh=448M
CPUQuota=100%
CPUWeight=50
IOWeight=50
TasksMax=256
Nice=10
OOMScoreAdjust=500
